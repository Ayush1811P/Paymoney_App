<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAYMONEY - Login</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/logo.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
</head>
<body>
  <div class="container">
    <div class="auth-container">
      <div class="logo">
        <a href="index.html" class="paymoney-logo">
          <img src="img/logo.png" alt="PayMoney Logo" class="logo-icon-img" style="height: 48px; object-fit: contain;">
          <span class="logo-text-css">
            <span class="pay-part">PAY</span><span class="money-part">MONEY</span>
          </span>
        </a>
      </div>
      
      <div class="form-container">
        <h2>Login to your account</h2>
        
        <form id="loginForm">
          <div class="form-group">
            <label for="loginId">Phone Number</label>
            <input type="text" id="loginId" required placeholder="Enter your 10-digit phone number">
          </div>
          
          <div class="form-group">
            <label for="loginPassword">Password</label>
            <div class="password-input-container">
              <input type="password" id="loginPassword" required placeholder="Enter your password">
              <button type="button" class="toggle-password-btn" aria-label="Toggle password visibility">
                <svg class="eye-icon eye-open" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                </svg>
                <svg class="eye-icon eye-closed" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="display:none;">
                  <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.82l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.74-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 2.2 0 4.27-.61 6.04-1.66l.46.46 2.28 2.28 1.27-1.27L3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
                </svg>
              </button>
            </div>
          </div>
          

          
          <button type="submit" class="btn btn-primary" id="loginBtn">Login</button>
        </form>
        
        <form id="otpFormLogin" style="display: none;">
          <h3>Email Verification</h3>
          <p>We've sent an 8-digit verification code to your registered email for 2FA.</p>
          <div class="form-group">
            <label for="otpInputLogin">Enter OTP</label>
            <input type="text" id="otpInputLogin" required placeholder="00000000" maxlength="8" style="text-align: center; letter-spacing: 5px; font-size: 1.2rem;">
          </div>
          <button type="submit" class="btn btn-primary" id="verifyLoginBtn">Verify & Login</button>
          
          <div style="margin-top: 15px; display: flex; justify-content: space-between; align-items: center;">
            <button type="button" class="btn btn-secondary" id="backToLoginBtn" style="background: #eee; color: #333; padding: 8px 16px;">Back</button>
            <div style="text-align: right;">
              <button type="button" id="resendOtpBtnLogin" disabled style="background: none; border: none; color: #00baf2; cursor: not-allowed; font-weight: 500;">Resend OTP</button>
              <span id="otpTimerDisplayLogin" style="display: block; font-size: 0.85rem; color: #757575;">Available in 100s</span>
            </div>
          </div>
        </form>
        
        <div class="auth-footer">
          <p>Don't have an account? <a href="register.html">Register Now</a></p>
        </div>
      </div>
    </div>
  </div>

  <div id="notification" class="notification"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  

  
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
